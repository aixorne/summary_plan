<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Summary of the Plan</title> 

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet"> 

<!-- Bootstrap 5 CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> 

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Flatpickr (Custom Datepicker) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/material_blue.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/th.js"></script>

<style> 
:root {
  --primary-gradient: linear-gradient(135deg, #0052D4 0%, #4364F7 50%, #6FB1FC 100%);
  --accent-color: #4364F7;
}

body {
  font-family: 'Prompt', sans-serif;
  background: #f0f4f9;
  color: #333;
} 

.app-header {
  background: var(--primary-gradient);
  box-shadow: 0 4px 15px rgba(0, 102, 255, 0.2);
}

.card-box {
  background: #ffffff;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  padding: 24px;
  margin-top: 20px;
  border: 1px solid rgba(255, 255, 255, 0.8);
} 

.table-header-custom {
  background: var(--primary-gradient);
  border-radius: 16px;
  padding: 15px;
}

/* Custom Input Styles */
.form-control, .custom-select-btn {
  border-radius: 12px;
  border: 1.5px solid #dce4ec;
  padding: 12px 16px;
  font-size: 0.95rem;
  transition: all 0.25s ease-in-out;
  background-color: #ffffff;
  color: #333;
  width: 100%;
  text-align: left;
}

.form-control:focus {
  border-color: var(--accent-color);
  box-shadow: 0 0 0 4px rgba(67, 100, 247, 0.15);
}

.custom-select-btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* Flatpickr Custom Design */
.flatpickr-calendar {
  border-radius: 16px !important;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15) !important;
  border: none !important;
  font-family: 'Prompt', sans-serif !important;
}

.flatpickr-day.selected {
  background: var(--accent-color) !important;
  border-color: var(--accent-color) !important;
}

/* Modal Selector Design */
.product-list-group .list-group-item {
  border-radius: 12px !important;
  margin-bottom: 8px;
  border: 1.5px solid #edf2f7;
  padding: 12px 16px;
  font-weight: 500;
  transition: all 0.2s ease;
  cursor: pointer;
}

.product-list-group .list-group-item:hover,
.product-list-group .list-group-item.active {
  background-color: #eef2ff;
  color: var(--accent-color);
  border-color: var(--accent-color);
}

/* Container สำหรับแสดงรายการผลลัพธ์ */
.result-display-box {
  background-color: #f8fafc;
  border: 1.5px solid #dce4ec;
  border-radius: 12px;
  padding: 16px;
  min-height: 180px;
  font-family: monospace, 'Prompt';
  font-size: 1rem;
}

.plan-header-title {
  font-weight: 700;
  color: #0052D4;
  font-size: 1.15rem;
  margin-bottom: 12px;
  border-bottom: 2px dashed #cbd5e1;
  padding-bottom: 8px;
}

.product-group-block {
  margin-bottom: 16px;
}

.product-title {
  font-weight: 700;
  color: #2b3674;
  font-size: 1.05rem;
  margin-bottom: 4px;
}

.lot-item-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 3px 0;
}

.btn-delete-item {
  color: #e63946;
  background: none;
  border: none;
  font-size: 1rem;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
  transition: transform 0.15s ease;
}

.btn-delete-item:hover {
  transform: scale(1.25);
}

/* Buttons Styling */
.btn {
  border-radius: 12px;
  padding: 10px 18px;
  font-weight: 500;
  transition: all 0.2s ease;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 5px 12px rgba(0,0,0,0.12);
}

.btn-success { background-color: #2ec4b6; border: none; }
.btn-success:hover { background-color: #28b0a3; }

.btn-warning { background-color: #ff9f1c; border: none; color: #fff; }
.btn-warning:hover { background-color: #e88e13; color: #fff; }

.btn-primary { background-color: var(--accent-color); border: none; }
.btn-primary:hover { background-color: #3151d8; }

.btn-info { background-color: #00b4d8; border: none; color: #fff; }
.btn-info:hover { background-color: #0096c7; color: #fff; }

.btn-danger { background-color: #e63946; border: none; }
.btn-danger:hover { background-color: #d62837; }
</style> 

</head> 

<body> 

<div class="app-header">
  <div class="text-center text-white p-3">
    <h3 class="mb-0 fw-bold">📊 สรุปยอดแผนประจำวัน</h3>
  </div>
</div> 

<div class="container mb-5"> 
  <div class="card-box"> 

    <div class="table-header-custom shadow-sm"> 
      <div class="row g-3"> 

        <!-- ปุ่มเลือกสินค้า (เปิด Modal) -->
        <div class="col-md-3 col-12">
          <label class="form-label text-white fw-bold d-md-block d-none">สินค้า</label>
          <button class="custom-select-btn" type="button" data-bs-toggle="modal" data-bs-target="#productModal">
            <span id="selectedProductText">📦 เลือกสินค้า...</span>
            <small>▼</small>
          </button>
          <input type="hidden" id="productVal" value="">
        </div> 

        <!-- ตัวเลือกวันที่ (Flatpickr) -->
        <div class="col-md-3 col-12"> 
          <label class="form-label text-white fw-bold d-md-block d-none">Lot (วันที่)</label>
          <input type="text" class="form-control" id="lotDate" placeholder="📅 เลือกวันที่ Lot..."> 
        </div> 

        <!-- ช่องกรอก Batch -->
        <div class="col-md-3 col-12"> 
          <label class="form-label text-white fw-bold d-md-block d-none">Batch</label>
          <input type="text" 
                 inputmode="numeric" 
                 pattern="[0-9]*" 
                 class="form-control" 
                 id="batch" 
                 placeholder="🏷️ Ex. 12-34 หรือ 12-345" 
                 maxlength="6" 
                 oninput="formatBatchInput(this)"> 
        </div> 

        <!-- ช่องกรอกจำนวน (ไม่บังคับ) -->
        <div class="col-md-3 col-12"> 
          <label class="form-label text-white fw-bold d-md-block d-none">รับเข้า (ไม่บังคับ)</label>
          <input type="number" class="form-control" id="qty" placeholder="🔢 จำนวนรับเข้า (ถ้ามี)"> 
        </div> 

      </div>
    </div> 

    <!-- ปุ่ม Save & Clear Form -->
    <div class="mt-4 d-flex flex-wrap gap-2"> 
      <button class="btn btn-success flex-grow-1 flex-md-grow-0" onclick="saveData()">💾 Save</button> 
      <button class="btn btn-warning flex-grow-1 flex-md-grow-0" onclick="clearForm()">🧹 Clear Form</button> 
    </div> 

    <!-- ผลลัพธ์ -->
    <div class="mt-4"> 
      <div class="d-flex justify-content-between align-items-center mb-2">
        <label class="form-label fw-bold fs-5 text-secondary mb-0">📋 ผลลัพธ์</label> 
      </div>

      <!-- กล่องแสดงผลรายการ -->
      <div id="resultDisplay" class="result-display-box">
        <span class="text-muted">ยังไม่มีข้อมูล กด Save เพื่อบันทึกข้อมูล...</span>
      </div>
      
      <div class="mt-3 d-flex flex-wrap gap-2">
        <button class="btn btn-primary" onclick="copyText()">📋 Copy ข้อความ</button> 
        <button class="btn btn-info" onclick="sortData()">📅 จัดเรียงวันที่ (น้อย->มาก)</button> 
        <button class="btn btn-danger" onclick="clearTextArea()">🗑 ลบข้อความทั้งหมด</button> 
      </div>
    </div> 

  </div> 
</div> 

<!-- Modal เลือกสินค้า -->
<div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content" style="border-radius: 20px; border:none;">
      <div class="modal-header" style="background: var(--primary-gradient); color:white; border-radius: 20px 20px 0 0;">
        <h5 class="modal-title fw-bold">📦 เลือกรายการสินค้า</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-3">
        <!-- Search Input -->
        <input type="text" class="form-control mb-3" id="searchProduct" placeholder="🔍 ค้นหาสินค้า..." onkeyup="filterProducts()">
        
        <!-- รายการสินค้า -->
        <div class="list-group product-list-group" id="productList">
          <div class="list-group-item" onclick="selectProduct('เต้าส่วน')">เต้าส่วน</div>
          <div class="list-group-item" onclick="selectProduct('กล้วยแดง')">กล้วยแดง</div>
          <div class="list-group-item" onclick="selectProduct('กล้วยลูก')">กล้วยลูก</div>
          <div class="list-group-item" onclick="selectProduct('ขนมตาล')">ขนมตาล</div>
          <div class="list-group-item" onclick="selectProduct('ถ้วยฟู')">ถ้วยฟู</div>
          <div class="list-group-item" onclick="selectProduct('ถั่วแปบ')">ถั่วแปบ</div>
          <div class="list-group-item" onclick="selectProduct('โมจิโอวัลติน')">โมจิโอวัลติน</div>
          <div class="list-group-item" onclick="selectProduct('พุดดิ้งโอวัลติน')">พุดดิ้งโอวัลติน</div>
          <div class="list-group-item" onclick="selectProduct('ตะโก้สาคู')">ตะโก้สาคู</div>
          <div class="list-group-item" onclick="selectProduct('ตะโก้เผือก')">ตะโก้เผือก</div>
          <div class="list-group-item" onclick="selectProduct('มันทิพย์')">มันทิพย์</div>
          <div class="list-group-item" onclick="selectProduct('เผือกทิพย์')">เผือกทิพย์</div>
          <div class="list-group-item" onclick="selectProduct('ข้าวเหนียวลำไย')">ข้าวเหนียวลำไย</div>
          <div class="list-group-item" onclick="selectProduct('โมจิใส')">โมจิใส</div>
          <div class="list-group-item" onclick="selectProduct('ชานมโมจิ')">ชานมโมจิ</div>
          
          <div class="list-group-item" onclick="selectProduct('ไข่มุกทรงเครื่อง')">ไข่มุกทรงเครื่อง</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script> 
const STORAGE_KEY = "summary_plan_data_v2"; 
const PLAN_INFO_KEY = "summary_plan_info_v2"; 
const RECORD_DATE_KEY = "summary_plan_date_v2"; // เก็บวันที่ล่าสุดที่มีการกด Save

let appData = []; 
let planHeader = ""; 
let productModalObj;

window.onload = function(){ 
  checkMidnightReset(); // ตรวจสอบข้ามคืนทันทีที่เปิดเว็บ

  const data = localStorage.getItem(STORAGE_KEY); 
  const savedHeader = localStorage.getItem(PLAN_INFO_KEY);

  if(data){
    try {
      appData = JSON.parse(data);
    } catch(e) {
      appData = [];
    }
  } 

  if(savedHeader && appData.length > 0){
    planHeader = savedHeader;
  }

  renderData();

  // ติดตั้ง Flatpickr Date Picker
  flatpickr("#lotDate", {
    locale: "th",
    dateFormat: "Y-m-d",
    altInput: true,
    altFormat: "j F Y",
    disableMobile: "true"
  });

  productModalObj = new bootstrap.Modal(document.getElementById('productModal'));

  // เช็คเที่ยงคืนแบบ Realtime ทุกๆ 10 วินาที
  setInterval(checkMidnightReset, 10000);
};

/* ฟังก์ชันตรวจสอบและล้างข้อมูลเมื่อข้ามคืน (ผ่านเที่ยงคืน 00:00 น.) */
function checkMidnightReset() {
  const lastRecordedDate = localStorage.getItem(RECORD_DATE_KEY);
  const todayDateStr = new Date().toDateString();

  if (lastRecordedDate && lastRecordedDate !== todayDateStr) {
    appData = [];
    planHeader = "";
    localStorage.removeItem(STORAGE_KEY);
    localStorage.removeItem(PLAN_INFO_KEY);
    localStorage.removeItem(RECORD_DATE_KEY);
    renderData();
  }
}

function formatBatchInput(input) {
  let val = input.value.replace(/\D/g, ''); 
  if (val.length > 5) val = val.substring(0, 5); 
  
  if (val.length > 2) {
    input.value = val.substring(0, 2) + '-' + val.substring(2);
  } else {
    input.value = val;
  }
}

function generatePlanHeader() {
  const now = new Date();
  const hours = now.getHours();
  
  let targetDate = new Date(now);
  let timeStr = "";

  if (hours < 12) {
    timeStr = "ดึก";
    targetDate.setDate(targetDate.getDate() - 1);
  } else {
    timeStr = "เช้า";
  }

  const dd = String(targetDate.getDate()).padStart(2, '0');
  const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
  const yy = String(targetDate.getFullYear()).slice(-2);

  return `แผน ${dd}${mm}${yy} ${timeStr}`;
}

function selectProduct(name) {
  document.getElementById("selectedProductText").innerText = "📦 " + name;
  document.getElementById("productVal").value = name;
  productModalObj.hide();
}

function filterProducts() {
  const input = document.getElementById('searchProduct').value.toLowerCase();
  const items = document.querySelectorAll('#productList .list-group-item');
  items.forEach(item => {
    const text = item.innerText.toLowerCase();
    item.style.display = text.includes(input) ? '' : 'none';
  });
}

function renderData() {
  const displayBox = document.getElementById("resultDisplay");
  if(appData.length === 0){
    displayBox.innerHTML = '<span class="text-muted">ยังไม่มีข้อมูล กด Save เพื่อบันทึกข้อมูล...</span>';
    return;
  }

  let html = `<div class="plan-header-title">${planHeader}</div>`;
  appData.forEach((group, groupIdx) => {
    html += `<div class="product-group-block">`;
    html += `<div class="product-title">${group.product}</div>`;
    group.items.forEach((itemText, itemIdx) => {
      html += `
        <div class="lot-item-row">
          <span>${itemText}</span>
          <button class="btn-delete-item" onclick="deleteSingleItem(${groupIdx}, ${itemIdx})" title="ลบรายการนี้">⨂</button>
        </div>
      `;
    });
    html += `</div>`;
  });

  displayBox.innerHTML = html;
}

function saveData(){ 
  checkMidnightReset(); // ตรวจสอบข้ามคืนก่อนบันทึกทุกครั้ง

  const productVal = document.getElementById("productVal").value;
  const lotDate = document.getElementById("lotDate").value;
  const batch = document.getElementById("batch").value.trim();
  const qty = document.getElementById("qty").value;

  if(productVal == ""){
    Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณาเลือกสินค้า', confirmButtonColor: '#4364F7' });
    return;
  } 

  if(lotDate == "" || batch == ""){
    Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ครบถ้วน', text: 'กรุณากรอก วันที่ (Lot) และ Batch ให้เรียบร้อย', confirmButtonColor: '#4364F7' });
    return;
  } 

  const batchPattern = /^\d{2}-\d{2,3}$/;
  if(!batchPattern.test(batch)){
    Swal.fire({ 
      icon: 'warning', 
      title: 'รูปแบบ Batch ไม่ถูกต้อง', 
      text: 'กรุณากรอก Batch ในรูปแบบ xx-xx หรือ xx-xxx เท่านั้น (เช่น 12-34 หรือ 12-345)', 
      confirmButtonColor: '#4364F7' 
    });
    return;
  }

  // หากเป็นสินค้าชิ้นแรก ให้คำนวณตั้งค่า Header แผนประจำวันขึ้นมาใหม่
  if(appData.length === 0){
    planHeader = generatePlanHeader();
    localStorage.setItem(PLAN_INFO_KEY, planHeader);
    localStorage.setItem(RECORD_DATE_KEY, new Date().toDateString());
  }

  const day = lotDate.split("-")[2]; 
  const number = qty !== "" ? Number(qty).toLocaleString("en-US") : ""; 
  const lotLine = `${day}/${batch}=${number}`;

  let existingGroup = appData.find(g => g.product === productVal);
  if(existingGroup){
    existingGroup.items.push(lotLine);
  } else {
    appData.push({
      product: productVal,
      items: [lotLine]
    });
  }

  saveAndRefresh();

  Swal.fire({
    icon: 'success',
    title: 'บันทึกสำเร็จ!',
    timer: 1300,
    showConfirmButton: false
  });

  clearForm(); 
} 

function deleteSingleItem(groupIdx, itemIdx) {
  const targetItem = appData[groupIdx].items[itemIdx];
  const productName = appData[groupIdx].product;

  Swal.fire({
    title: 'ยืนยันการลบ?',
    text: `ต้องการลบรายการ "${productName} : ${targetItem}" ใช่หรือไม่?`,
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#e63946',
    cancelButtonColor: '#6c757d',
    confirmButtonText: 'ใช่, ลบรายการนี้!',
    cancelButtonText: 'ยกเลิก'
  }).then((resultAction) => {
    if (resultAction.isConfirmed) {
      appData[groupIdx].items.splice(itemIdx, 1);
      if(appData[groupIdx].items.length === 0){
        appData.splice(groupIdx, 1);
      }
      
      if(appData.length === 0){
        planHeader = "";
        localStorage.removeItem(PLAN_INFO_KEY);
        localStorage.removeItem(RECORD_DATE_KEY);
      }

      saveAndRefresh();
      Swal.fire({ icon: 'success', title: 'ลบเรียบร้อย!', timer: 1000, showConfirmButton: false });
    }
  });
}

function getDayNumber(itemStr) {
  const dayStr = itemStr.split("/")[0];
  return parseInt(dayStr, 10) || 0;
}

function sortData() {
  if(appData.length === 0) return;

  appData.forEach(group => {
    group.items.sort((a, b) => getDayNumber(a) - getDayNumber(b));
  });

  appData.sort((a, b) => {
    const minDayA = Math.min(...a.items.map(getDayNumber));
    const minDayB = Math.min(...b.items.map(getDayNumber));
    return minDayA - minDayB;
  });

  saveAndRefresh();
  Swal.fire({ icon: 'success', title: 'จัดเรียงตามวันที่เรียบร้อย!', timer: 1200, showConfirmButton: false });
}

function getFormattedPlainText() {
  if (appData.length === 0) return "";
  
  const productsText = appData.map(group => {
    return `${group.product}\n` + group.items.join("\n");
  }).join("\n\n");

  return `${planHeader}\n\n${productsText}`;
}

function saveAndRefresh() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
  renderData();
}

function clearForm(){ 
  document.getElementById("selectedProductText").innerText = "📦 เลือกสินค้า...";
  document.getElementById("productVal").value = "";
  document.getElementById("lotDate").value = "";
  if(document.getElementById("lotDate")._flatpickr) {
    document.getElementById("lotDate")._flatpickr.clear();
  }
  document.getElementById("batch").value = "";
  document.getElementById("qty").value = ""; 
}

function copyText(){ 
  const text = getFormattedPlainText();
  if(text === ""){
    Swal.fire({ icon: 'info', title: 'ไม่พบข้อมูล', text: 'ไม่มีข้อมูลสำหรับคัดลอก', confirmButtonColor: '#4364F7' });
    return;
  } 

  navigator.clipboard.writeText(text)
  .then(()=>{
    Swal.fire({ icon: 'success', title: 'คัดลอกเรียบร้อย!', timer: 1300, showConfirmButton: false });
  })
  .catch(()=>{
    const dummy = document.createElement("textarea");
    document.body.appendChild(dummy);
    dummy.value = text;
    dummy.select();
    document.execCommand("copy");
    document.body.removeChild(dummy);
    Swal.fire({ icon: 'success', title: 'คัดลอกเรียบร้อย!', timer: 1300, showConfirmButton: false });
  }); 
} 

function clearTextArea(){ 
  if(appData.length === 0){
    return;
  }

  Swal.fire({
    title: 'ยืนยันการลบทั้งหมด?',
    text: "ต้องการลบข้อมูลทั้งหมดใช่หรือไม่?",
    icon: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#e63946',
    cancelButtonColor: '#6c757d',
    confirmButtonText: 'ใช่, ลบทั้งหมด!',
    cancelButtonText: 'ยกเลิก'
  }).then((resultAction) => {
    if (resultAction.isConfirmed) {
      appData = [];
      planHeader = "";
      localStorage.removeItem(PLAN_INFO_KEY);
      localStorage.removeItem(RECORD_DATE_KEY);
      saveAndRefresh();
      Swal.fire({ icon: 'success', title: 'ลบเรียบร้อย!', timer: 1200, showConfirmButton: false });
    }
  });
} 
</script>
